<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/images/favicon.ico">
<title>Packet Loss Intelligence — Menu</title>
<link rel="stylesheet" href="assets/css/font-awesome.min.css">
<link rel="stylesheet" href="assets/css/home.css">
<script src="assets/js/guard.js"></script>
</head>
<body class="home-page">

<!-- ============================================================
     HEADER avec bouton retour
     ============================================================ -->
<header class="home-topbar">
  <div class="home-topbar__inner">
    <button id="backToHomeBtn" class="home-action home-action--with-label" data-i18n-title="menu.back" title="Changer de pays">
      <i class="fa-solid fa-arrow-left"></i>
      <span data-i18n="menu.back">Changer de pays</span>
    </button>
    <div class="home-brand home-brand--compact">
      <div class="home-brand__logo">
        <img src="assets/images/logo1.png" alt="NPM" class="home-brand__logo-img">
      </div>
      <div class="home-brand__name">
        <h1>Packet Loss <span>Intelligence</span></h1>
        <p id="menuCountryLabel">Chargement...</p>
      </div>
    </div>
    <div class="home-topbar__actions">
      <button id="adminMenuBtn" class="home-action home-action--with-label hidden" data-admin-only data-i18n-title="nav.admin" title="Administration">
        <i class="fa-solid fa-user-gear"></i>
        <span data-i18n="nav.admin">Administration</span>
      </button>
      <button id="darkModeBtn" class="home-action" data-i18n-title="nav.theme" title="Basculer le thème">
        <i class="fa-solid fa-moon"></i>
      </button>
      <a href="account.html" class="home-action" data-i18n-title="nav.account" title="Mon compte">
        <i class="fa-solid fa-user"></i>
      </a>
      <button id="logoutMenuBtn" class="home-action home-action--with-label" data-i18n-title="nav.logout" title="Déconnexion">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span data-i18n="nav.logout">Déconnexion</span>
      </button>
    </div>
  </div>
</header>

<!-- ============================================================
     HERO — Titre + Badge pays
     ============================================================ -->
<section class="home-hero">
  <div class="home-hero__content">
    <span class="home-hero__eyebrow" id="menuCountryBadge">
      <i class="fa-solid fa-flag"></i> Chargement...
    </span>
    <h2 class="home-hero__title" data-i18n-html="menu.title">
      Que souhaitez-vous <span>visualiser</span> ?
    </h2>
    <p class="home-hero__subtitle" data-i18n="menu.subtitle">
      Choisissez un module d'analyse pour démarrer votre consultation.
    </p>
  </div>
</section>

<!-- ============================================================
     GRILLE DES MODULES
     ============================================================ -->
<main class="home-container">
  <div class="module-grid" id="moduleGrid">
    <!-- Modules injectés par home.js -->
  </div>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/home.js"></script>
<script src="assets/js/notify.js"></script>
</body>
</html>
